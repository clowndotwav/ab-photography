# Netlify config for AB Photography.
# Netlify reads this automatically — you don't have to do anything with it.

[build]
  publish = "."          # the site is already built; serve this folder as-is

  # Every photo is its own file in data/photos/ so the admin centre at /admin
  # can show them as a grid of thumbnails. This stitches them back into the
  # single data/gallery.json the site reads. It has no dependencies and never
  # exits non-zero: if anything is wrong it leaves the committed gallery.json
  # alone and logs why, so a bad photo file can't stop the site deploying.
  command = "node tools/build-gallery.mjs"

# Photos are cached for a day and then revalidated. They were briefly marked
# "immutable" with a one-year max-age, which was wrong for this site: the
# filenames are stable (wildlife-01.jpg and so on) but their CONTENTS get
# replaced — a re-edit, a re-crop, a watermark change. "immutable" tells a
# browser not even to ask, so a replaced photo stays stale for a year and a
# half-loaded one never recovers. Revalidation costs one cheap 304.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The gallery and page text are data now, edited from /admin. They must never
# sit in a cache, or an edit would appear to do nothing.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep the admin centre out of Google.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Sensible security headers for a static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
